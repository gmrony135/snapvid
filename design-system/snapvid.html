/* ==========================================================================
   SnapVid — Design System
   Premium cross-platform video downloader · dark-first, light alternative
   Tokens → Primitives → Components → App shell → Device frames → Studio
   ========================================================================== */

/* ------------------------------ 1. TOKENS -------------------------------- */
:root {
  /* Brand */
  --sv-accent: #ff6b2c;
  --sv-accent-600: #e9541a;
  --sv-accent-700: #c9430f;
  --sv-accent-ink: #12100e;          /* text on accent fill (dark theme) */
  --sv-accent-text: #ff8d4f;         /* accent as text/icon (dark theme) */
  --sv-accent-soft: rgba(255, 107, 44, 0.14);
  --sv-accent-ring: rgba(255, 107, 44, 0.32);

  /* Status */
  --sv-ok: #34d399;
  --sv-ok-soft: rgba(52, 211, 153, 0.14);
  --sv-warn: #fbbf24;
  --sv-warn-soft: rgba(251, 191, 36, 0.14);
  --sv-danger: #ff5a5f;
  --sv-danger-soft: rgba(255, 90, 95, 0.14);
  --sv-info: #60a5fa;
  --sv-info-soft: rgba(96, 165, 250, 0.14);

  /* Radii — generous, iOS-like */
  --r-xs: 10px;
  --r-sm: 14px;
  --r-md: 18px;
  --r-lg: 22px;
  --r-xl: 28px;
  --r-2xl: 34px;
  --r-pill: 999px;

  /* Space scale (4pt) */
  --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px;
  --s-5: 20px; --s-6: 24px; --s-7: 32px; --s-8: 40px; --s-9: 56px;

  /* Motion */
  --e-out: cubic-bezier(.22, .9, .26, 1);
  --e-spring: cubic-bezier(.34, 1.42, .5, 1);
  --t-fast: 130ms;
  --t-base: 240ms;
  --t-slow: 520ms;

  /* Type */
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
          "Segoe UI Variable", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-num: ui-rounded, "SF Pro Rounded", "SF Pro Display", var(--font);

  /* Touch */
  --tap: 48px;
}

/* Dark theme (primary) */
[data-theme="dark"] {
  --bg: #08090b;
  --bg-sep: #0b0c0f;
  --surface: #101216;
  --surface-2: #16191e;
  --card: rgba(255, 255, 255, 0.045);
  --card-hover: rgba(255, 255, 255, 0.075);
  --stroke: rgba(255, 255, 255, 0.085);
  --stroke-strong: rgba(255, 255, 255, 0.16);
  --text: #ffffff;
  --text-2: #9ba1a8;
  --text-3: #6b7178;
  --glass: rgba(20, 22, 27, 0.72);
  --glass-2: rgba(13, 15, 18, 0.86);
  --accent-ink: #12100e;
  --accent-text: #ff8d4f;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-2: 0 10px 30px -12px rgba(0, 0, 0, .7), 0 2px 8px rgba(0, 0, 0, .35);
  --shadow-3: 0 28px 70px -24px rgba(0, 0, 0, .8), 0 6px 20px rgba(0, 0, 0, .4);
  --glow: 0 12px 34px -12px rgba(255, 107, 44, .55);
  --skeleton: linear-gradient(90deg, rgba(255,255,255,.05), rgba(255,255,255,.11), rgba(255,255,255,.05));
  color-scheme: dark;
}

/* Light theme (alternative) */
[data-theme="light"] {
  --bg: #f4f5f7;
  --bg-sep: #eceef1;
  --surface: #ffffff;
  --surface-2: #f7f8fa;
  --card: rgba(255, 255, 255, 0.78);
  --card-hover: #ffffff;
  --stroke: rgba(10, 11, 13, 0.09);
  --stroke-strong: rgba(10, 11, 13, 0.16);
  --text: #0a0b0d;
  --text-2: #5c636b;
  --text-3: #878e96;
  --glass: rgba(255, 255, 255, 0.76);
  --glass-2: rgba(255, 255, 255, 0.9);
  --accent: #f4551a;
  --accent-600: #d9410d;
  --accent-ink: #ffffff;
  --accent-text: #c2410c;
  --accent-soft: rgba(244, 85, 26, 0.10);
  --shadow-1: 0 1px 2px rgba(16, 24, 40, .06);
  --shadow-2: 0 10px 28px -14px rgba(16, 24, 40, .22), 0 2px 6px rgba(16, 24, 40, .06);
  --shadow-3: 0 30px 70px -30px rgba(16, 24, 40, .3), 0 8px 20px rgba(16, 24, 40, .08);
  --glow: 0 12px 30px -14px rgba(244, 85, 26, .5);
  --skeleton: linear-gradient(90deg, rgba(0,0,0,.05), rgba(0,0,0,.09), rgba(0,0,0,.05));
  color-scheme: light;
}

/* ---------------------------- 2. PRIMITIVES ------------------------------ */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  background: #06070a;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; padding: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible {
  outline: 2px solid var(--accent-text);
  outline-offset: 2px;
  border-radius: 8px;
}
.sv-sr {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}
.sv-ico { display: block; flex: none; }

/* Text roles */
.t-h1 { font-size: 34px; line-height: 1.1; letter-spacing: -.03em; font-weight: 700; margin: 0; }
.t-h2 { font-size: 26px; line-height: 1.16; letter-spacing: -.025em; font-weight: 700; margin: 0; }
.t-h3 { font-size: 19px; line-height: 1.25; letter-spacing: -.02em; font-weight: 650; margin: 0; }
.t-body { font-size: 15.5px; line-height: 1.5; color: var(--text-2); margin: 0; }
.t-sm { font-size: 13.5px; line-height: 1.45; color: var(--text-2); margin: 0; }
.t-xs { font-size: 12px; line-height: 1.4; color: var(--text-3); margin: 0; }
.t-label { font-size: 11.5px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
.t-num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.mono-num { font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

/* --------------------------- 3. COMPONENTS ------------------------------- */
/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  min-height: var(--tap); padding: 0 20px;
  border-radius: var(--r-pill);
  font-size: 16px; font-weight: 600; letter-spacing: -.01em;
  color: var(--text);
  background: var(--card);
  border: 1px solid var(--stroke);
  box-shadow: var(--shadow-1);
  transition: transform var(--t-fast) var(--e-out), background var(--t-fast) var(--e-out),
              border-color var(--t-fast) var(--e-out), box-shadow var(--t-fast) var(--e-out);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.btn:hover { background: var(--card-hover); }
.btn:active { transform: scale(.968); }
.btn--primary {
  background: linear-gradient(180deg, var(--sv-accent) 0%, var(--sv-accent-600) 100%);
  color: var(--accent-ink);
  border-color: transparent;
  box-shadow: var(--glow), inset 0 1px 0 rgba(255, 255, 255, .28);
  font-weight: 680;
}
[data-theme="light"] .btn--primary { color: #fff; }
.btn--primary:hover { filter: brightness(1.04); }
.btn--lg { min-height: 56px; font-size: 17px; padding: 0 26px; }
.btn--block { width: 100%; }
.btn--ghost { background: transparent; border-color: transparent; box-shadow: none; color: var(--text-2); }
.btn--ghost:hover { background: var(--card); color: var(--text); }
.btn--outline { background: transparent; }
.btn--danger { color: var(--sv-danger); border-color: color-mix(in oklab, var(--sv-danger) 30%, transparent); background: var(--sv-danger-soft); }
.btn--sm { min-height: 40px; font-size: 14.5px; padding: 0 16px; }
.btn--icon { min-width: 44px; min-height: 44px; padding: 0; border-radius: var(--r-pill); }
.btn:disabled { opacity: .45; pointer-events: none; }

/* Cards & surfaces */
.card {
  background: var(--card);
  border: 1px solid var(--stroke);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-2);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
}
.card--flat { box-shadow: none; }
.card--pad { padding: var(--s-5); }
.inset-card { background: var(--card); border: 1px solid var(--stroke); border-radius: var(--r-lg); }

/* Chips / badges */
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  height: 26px; padding: 0 10px; border-radius: var(--r-pill);
  font-size: 12px; font-weight: 650; letter-spacing: -.005em;
  background: var(--card); border: 1px solid var(--stroke); color: var(--text-2);
  white-space: nowrap;
}
.badge--accent { background: var(--accent-soft); border-color: var(--sv-accent-ring); color: var(--accent-text); }
.badge--ok { background: var(--sv-ok-soft); border-color: color-mix(in oklab, var(--sv-ok) 30%, transparent); color: var(--sv-ok); }
.badge--warn { background: var(--sv-warn-soft); border-color: color-mix(in oklab, var(--sv-warn) 30%, transparent); color: #d99b09; }
[data-theme="dark"] .badge--warn { color: var(--sv-warn); }
.badge--danger { background: var(--sv-danger-soft); border-color: color-mix(in oklab, var(--sv-danger) 32%, transparent); color: var(--sv-danger); }
.badge--solid { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
[data-theme="light"] .badge--solid { color: #fff; }

/* Segmented control (iOS style) */
.seg {
  position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
  gap: 3px; padding: 3px; border-radius: var(--r-pill);
  background: var(--surface-2); border: 1px solid var(--stroke);
}
[data-theme="dark"] .seg { background: rgba(255, 255, 255, .05); }
.seg button {
  position: relative; z-index: 1; height: 38px; border-radius: var(--r-pill);
  font-size: 14px; font-weight: 600; color: var(--text-2);
  transition: color var(--t-base) var(--e-out);
}
.seg button[aria-selected="true"] { color: var(--text); }
.seg__thumb {
  position: absolute; z-index: 0; top: 3px; bottom: 3px; left: 3px;
  border-radius: var(--r-pill); background: var(--surface);
  box-shadow: var(--shadow-1); border: 1px solid var(--stroke);
  transition: transform var(--t-base) var(--e-out), width var(--t-base) var(--e-out);
}
[data-theme="dark"] .seg__thumb { background: #22262d; border-color: rgba(255,255,255,.09); }

/* Switch */
.sw { position: relative; width: 52px; height: 32px; flex: none; border-radius: var(--r-pill);
  background: var(--stroke-strong); transition: background var(--t-base) var(--e-out); }
.sw::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px;
  border-radius: 50%; background: #fff; box-shadow: var(--shadow-1);
  transition: transform var(--t-base) var(--e-spring);
}
.sw[aria-checked="true"] { background: var(--sv-accent); }
.sw[aria-checked="true"]::after { transform: translateX(20px); }
.sw:active::after { width: 28px; }

/* Lists / rows */
.rows { display: flex; flex-direction: column; }
.row {
  display: flex; align-items: center; gap: var(--s-4);
  min-height: 58px; padding: 10px 4px;
  border-bottom: 1px solid var(--stroke);
  text-align: left; width: 100%;
}
.rows > .row:last-child { border-bottom: 0; }
.row--tap { border-radius: var(--r-md); padding-left: 8px; padding-right: 8px; transition: background var(--t-fast); }
.row--tap:active, .row--tap:hover { background: var(--card); }
.row__txt { min-width: 0; flex: 1; }
.row__title { font-size: 15.5px; font-weight: 550; letter-spacing: -.01em; display: block; }
.row__sub { display: block; margin-top: 3px; }
.row__chev { color: var(--text-3); flex: none; }
.row__ico {
  width: 38px; height: 38px; border-radius: 11px; flex: none;
  display: grid; place-items: center;
  background: var(--card); border: 1px solid var(--stroke); color: var(--text-2);
}
.row__ico--accent { background: var(--accent-soft); border-color: var(--sv-accent-ring); color: var(--accent-text); }

/* Section header */
.sec-head { display: flex; align-items: baseline; justify-content: space-between; margin: 26px 0 10px; }
.sec-head__t { font-size: 13px; font-weight: 680; letter-spacing: .04em; text-transform: uppercase; color: var(--text-3); }
.sec-head__a { font-size: 13.5px; font-weight: 600; color: var(--accent-text); }

/* Input — URL field */
.field {
  display: flex; align-items: center; gap: 10px;
  min-height: 60px; padding: 6px 6px 6px 16px;
  background: var(--surface);
  border: 1px solid var(--stroke);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-1);
  transition: border-color var(--t-fast) var(--e-out), box-shadow var(--t-fast) var(--e-out);
}
[data-theme="dark"] .field { background: rgba(255, 255, 255, .05); }
.field:focus-within { border-color: var(--sv-accent); box-shadow: 0 0 0 4px var(--sv-accent-ring); }
.field--error { border-color: var(--sv-danger); box-shadow: 0 0 0 4px var(--sv-danger-soft); }
.field input {
  flex: 1; min-width: 0; height: 44px; border: 0; background: none; outline: none;
  font-size: 16px; letter-spacing: -.01em; color: var(--text);
}
.field input::placeholder { color: var(--text-3); }
.field__ico { color: var(--text-3); flex: none; }

/* Quality option */
.qopt {
  position: relative; display: flex; align-items: center; gap: 14px; width: 100%;
  min-height: 64px; padding: 11px 14px; text-align: left;
  border-radius: var(--r-lg); border: 1px solid var(--stroke);
  background: var(--card);
  transition: border-color var(--t-base) var(--e-out), background var(--t-base) var(--e-out),
              transform var(--t-fast) var(--e-out);
}
.qopt:hover { background: var(--card-hover); }
.qopt:active { transform: scale(.988); }
.qopt[aria-checked="true"] {
  border-color: var(--sv-accent);
  background: var(--accent-soft);
  box-shadow: 0 0 0 1px var(--sv-accent) inset;
}
.qopt__res { font-size: 16.5px; font-weight: 650; letter-spacing: -.02em; flex: none; }
.qopt__top { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.qopt__meta {
  display: flex; align-items: center; gap: 7px; margin-top: 4px;
  flex-wrap: nowrap; overflow: hidden; white-space: nowrap;
}
.qopt__meta > .t-xs { overflow: hidden; text-overflow: ellipsis; }
.qopt__meta > .t-xs:last-of-type { min-width: 0; }
.qopt__size { flex: none; text-align: right; font-size: 14px; font-weight: 620; font-variant-numeric: tabular-nums; }
.qopt__check {
  width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center;
  border: 1.6px solid var(--stroke-strong); color: transparent;
  transition: all var(--t-base) var(--e-spring);
}
.qopt[aria-checked="true"] .qopt__check {
  background: var(--sv-accent); border-color: var(--sv-accent); color: var(--accent-ink);
  transform: scale(1.06);
}
[data-theme="light"] .qopt[aria-checked="true"] .qopt__check { color: #fff; }
.qopt__bar { position: absolute; left: 14px; right: 14px; bottom: -1px; height: 0; }

/* Progress ring */
.ring { position: relative; display: grid; place-items: center; }
.ring svg { transform: rotate(-90deg); display: block; }
.ring__track { stroke: var(--stroke); }
.ring__fill {
  stroke: var(--sv-accent); stroke-linecap: round;
  transition: stroke-dashoffset 480ms var(--e-out);
  filter: drop-shadow(0 0 10px rgba(255, 107, 44, .45));
}
.ring__label { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring__pct { font-family: var(--font-num); font-size: 46px; font-weight: 700; letter-spacing: -.04em; line-height: 1; }
.ring__pct small { font-size: 22px; font-weight: 650; opacity: .55; margin-left: 1px; }

/* Progress bar */
.bar { height: 8px; border-radius: var(--r-pill); background: var(--stroke); overflow: hidden; }
.bar__fill {
  height: 100%; border-radius: var(--r-pill);
  background: linear-gradient(90deg, var(--sv-accent-600), var(--sv-accent));
  transition: width 420ms var(--e-out);
}
.bar--indet .bar__fill { width: 42% !important; animation: indet 1.15s var(--e-out) infinite; }
@keyframes indet { 0% { transform: translateX(-105%); } 100% { transform: translateX(240%); } }

/* Bottom sheet */
.sheet-wrap { position: absolute; inset: 0; z-index: 40; display: flex; align-items: flex-end; }
.sheet-scrim {
  position: absolute; inset: 0; background: rgba(4, 5, 7, .55);
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  animation: fade var(--t-base) var(--e-out) both;
}
.sheet {
  position: relative; width: 100%; max-height: 88%;
  background: var(--glass-2);
  backdrop-filter: blur(26px) saturate(1.6);
  -webkit-backdrop-filter: blur(26px) saturate(1.6);
  border-top: 1px solid var(--stroke);
  border-radius: var(--r-2xl) var(--r-2xl) 0 0;
  box-shadow: var(--shadow-3);
  padding: 8px 18px calc(18px + var(--safe-b));
  animation: sheet-up var(--t-slow) var(--e-out) both;
  display: flex; flex-direction: column; min-height: 0;
}
.sheet__grab { width: 40px; height: 5px; border-radius: 3px; background: var(--stroke-strong); margin: 6px auto 12px; flex: none; }
.sheet__scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; min-height: 0; }
@keyframes sheet-up { from { transform: translateY(102%); } to { transform: translateY(0); } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }

/* Bottom navigation */
.tabbar {
  position: absolute; left: 12px; right: 12px;
  bottom: calc(10px + var(--safe-b));
  z-index: 30;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
  padding: 7px; border-radius: var(--r-2xl);
  background: var(--glass);
  border: 1px solid var(--stroke);
  backdrop-filter: blur(24px) saturate(1.8);
  -webkit-backdrop-filter: blur(24px) saturate(1.8);
  box-shadow: var(--shadow-3);
}
.tabbar button {
  position: relative; display: grid; place-items: center; gap: 4px;
  min-height: 56px; border-radius: var(--r-lg);
  color: var(--text-3); font-size: 11.5px; font-weight: 600; letter-spacing: -.005em;
  transition: color var(--t-base) var(--e-out), background var(--t-base) var(--e-out);
}
.tabbar button[aria-current="page"] { color: var(--accent-text); background: var(--accent-soft); }
.tabbar button:active { transform: scale(.96); }
.tabbar .dot {
  position: absolute; top: 7px; right: calc(50% - 22px); width: 7px; height: 7px; border-radius: 50%;
  background: var(--sv-accent); box-shadow: 0 0 0 2px var(--glass);
}

/* Top bar */
.appbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding: calc(var(--safe-t) + 8px) 18px 12px;
  background: linear-gradient(180deg, var(--bg) 62%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.appbar--solid { background: var(--glass-2); border-bottom: 1px solid var(--stroke); }
.appbar__brand { display: flex; align-items: center; gap: 10px; }
.appbar__mark {
  width: 32px; height: 32px; border-radius: 10px;
  background: linear-gradient(180deg, var(--sv-accent), var(--sv-accent-600));
  display: grid; place-items: center; color: #fff;
  box-shadow: 0 6px 16px -8px rgba(255, 107, 44, .8), inset 0 1px 0 rgba(255,255,255,.3);
}
.appbar__name { font-size: 17px; font-weight: 700; letter-spacing: -.025em; }

/* Thumbnails */
.thumb {
  position: relative; border-radius: var(--r-lg); overflow: hidden;
  background: var(--surface-2); border: 1px solid var(--stroke);
  aspect-ratio: 16 / 9;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block;
  animation: thumb-in 620ms var(--e-out) both; }
@keyframes thumb-in { from { opacity: 0; transform: scale(1.035); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
.thumb__scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 38%, rgba(0,0,0,.62) 100%); }
.thumb__play {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 62px; height: 62px; border-radius: 50%;
  background: rgba(12, 13, 16, .55); border: 1px solid rgba(255, 255, 255, .28);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  color: #fff; display: grid; place-items: center;
  transition: transform var(--t-base) var(--e-spring), background var(--t-base);
}
.thumb__play:hover { transform: translate(-50%, -50%) scale(1.06); background: rgba(12,13,16,.7); }
.thumb__dur {
  position: absolute; right: 10px; bottom: 10px;
  padding: 3px 8px; border-radius: 7px; font-size: 12px; font-weight: 650;
  background: rgba(6, 7, 10, .72); color: #fff; font-variant-numeric: tabular-nums;
  border: 1px solid rgba(255,255,255,.12);
}
.thumb__hd {
  position: absolute; left: 10px; top: 10px;
  padding: 3px 8px; border-radius: 7px; font-size: 11px; font-weight: 700; letter-spacing: .04em;
  background: var(--sv-accent); color: var(--accent-ink);
}
[data-theme="light"] .thumb__hd { color: #fff; }

/* List thumbnail row */
.mrow { display: flex; gap: 13px; align-items: center; width: 100%; text-align: left; }
.mrow__thumb { width: 108px; flex: none; border-radius: var(--r-sm); overflow: hidden; position: relative; aspect-ratio: 16/9; background: var(--surface-2); border: 1px solid var(--stroke); }
.mrow__thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mrow__body { min-width: 0; flex: 1; }
.mrow__title {
  font-size: 15px; font-weight: 600; letter-spacing: -.015em; line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.mrow__meta { display: flex; align-items: center; gap: 7px; margin-top: 6px; flex-wrap: wrap; }

/* Empty / error states */
.state { display: grid; place-items: center; text-align: center; padding: 34px 22px; gap: 4px; }
.state__art { margin-bottom: 18px; }
.state h3 { font-size: 20px; letter-spacing: -.025em; margin: 0 0 7px; font-weight: 680; }
.state p { max-width: 300px; margin: 0 auto; }
.state__actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; justify-content: center; }

/* Toasts / banners */
.banner {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 13px 15px; border-radius: var(--r-lg);
  background: var(--card); border: 1px solid var(--stroke);
}
.banner--warn { background: var(--sv-warn-soft); border-color: color-mix(in oklab, var(--sv-warn) 28%, transparent); }
.banner--danger { background: var(--sv-danger-soft); border-color: color-mix(in oklab, var(--sv-danger) 28%, transparent); }
.banner--info { background: var(--sv-info-soft); border-color: color-mix(in oklab, var(--sv-info) 26%, transparent); }
.banner__ico { flex: none; margin-top: 1px; }
.banner--warn .banner__ico { color: #d99b09; }
[data-theme="dark"] .banner--warn .banner__ico { color: var(--sv-warn); }
.banner--danger .banner__ico, .banner--danger .banner__t { color: var(--sv-danger); }
.banner--info .banner__ico { color: var(--sv-info); }
.banner__t { font-size: 14.5px; font-weight: 620; letter-spacing: -.01em; }
.banner__d { font-size: 13.5px; color: var(--text-2); margin-top: 3px; line-height: 1.45; }

/* Skeletons */
.sk { border-radius: var(--r-sm); background: var(--skeleton); background-size: 220% 100%; animation: sk 1.3s linear infinite; }
@keyframes sk { from { background-position: 120% 0; } to { background-position: -120% 0; } }

/* Spinner / analyzing */
.ringlet { width: 18px; height: 18px; flex: none; }
.ringlet circle { fill: none; stroke-width: 2.4; stroke-linecap: round; }
.ringlet .tr { stroke: rgba(255, 255, 255, .28); }
.ringlet .fl { stroke: #fff; stroke-dasharray: 44; stroke-dashoffset: 30; transform-origin: center; animation: spin 900ms linear infinite; }
[data-theme="light"] .ringlet .tr { stroke: rgba(0,0,0,.2); }
[data-theme="light"] .ringlet .fl { stroke: var(--accent-ink); }
@keyframes spin { to { transform: rotate(360deg); } }

/* Success check */
.checkwrap { position: relative; display: grid; place-items: center; }
.checkwrap .halo {
  position: absolute; inset: -6px; border-radius: 50%;
  background: radial-gradient(circle, var(--sv-ok-soft), transparent 68%);
  animation: halo 900ms var(--e-out) both;
}
@keyframes halo { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
.checkwrap svg .c-tick {
  stroke-dasharray: 46; stroke-dashoffset: 46;
  animation: draw 520ms var(--e-out) 160ms forwards;
}
.checkwrap svg .c-disc { transform-origin: center; animation: popin 620ms var(--e-spring) both; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes popin { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* Toast */
.toast {
  position: absolute; left: 50%; bottom: calc(96px + var(--safe-b)); transform: translateX(-50%);
  z-index: 60; display: flex; align-items: center; gap: 10px;
  padding: 11px 16px; border-radius: var(--r-pill);
  background: var(--glass-2); border: 1px solid var(--stroke); box-shadow: var(--shadow-3);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  font-size: 14px; font-weight: 550; white-space: nowrap;
  animation: toast-in 320ms var(--e-spring) both;
}
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 14px) scale(.96); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }

/* Policy note */
.policy {
  display: flex; gap: 9px; align-items: flex-start;
  font-size: 12.5px; line-height: 1.45; color: var(--text-3);
}
.policy svg { flex: none; margin-top: 1px; }

/* Source row */
.sources { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.source-chip {
  width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center;
  background: var(--card); border: 1px solid var(--stroke); color: var(--text-3);
}

/* Preview player */
.player { position: relative; border-radius: var(--r-xl); overflow: hidden; border: 1px solid var(--stroke); aspect-ratio: 16/9; background: #000; }
.player img { width: 100%; height: 100%; object-fit: cover; opacity: .82; display: block; }
.player__controls {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 14px 12px;
  display: flex; align-items: center; gap: 12px;
  background: linear-gradient(180deg, transparent, rgba(4, 5, 7, .85));
  color: #fff;
}
.player__scrub { flex: 1; height: 4px; border-radius: 3px; background: rgba(255,255,255,.28); position: relative; }
.player__scrub i { position: absolute; inset: 0 62% 0 0; background: var(--sv-accent); border-radius: 3px; }
.player__scrub b { position: absolute; top: 50%; left: 38%; transform: translate(-50%, -50%); width: 12px; height: 12px; border-radius: 50%; background: #fff; }

/* Scroll area of the app */
.scroll {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch; scroll-behavior: smooth;
  padding: 0 18px calc(136px + var(--safe-b));
}
.scroll--plain { padding-bottom: 28px; }
.scroll::-webkit-scrollbar { width: 8px; }
.scroll::-webkit-scrollbar-thumb { background: var(--stroke-strong); border-radius: 8px; }

/* Grid helpers */
.stack { display: flex; flex-direction: column; }
.gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .gap-4 { gap: 16px; } .gap-5 { gap: 20px; } .gap-6 { gap: 24px; }
.mt-2 { margin-top: 8px; } .mt-3 { margin-top: 12px; } .mt-4 { margin-top: 16px; } .mt-5 { margin-top: 20px; } .mt-6 { margin-top: 24px; }
.mb-4 { margin-bottom: 16px; } .mb-5 { margin-bottom: 20px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.center { display: flex; align-items: center; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

/* ------------------------- 4. DEVICE FRAMES ------------------------------ */
.device { position: relative; flex: none; }
.device__frame {
  position: relative; background: var(--bg); overflow: hidden;
  color: var(--text);
  display: flex; flex-direction: column;
  transition: width var(--t-base) var(--e-out), height var(--t-base) var(--e-out), border-radius var(--t-base);
}
/* iPhone */
.device[data-device="iphone"] .device__frame {
  width: 393px; height: 852px; border-radius: 54px;
  border: 11px solid #1b1e24;
  box-shadow: 0 40px 90px -40px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.06), inset 0 0 0 1px rgba(0,0,0,.8);
  --safe-t: 54px; --safe-b: 30px;
}
/* Android */
.device[data-device="android"] .device__frame {
  width: 412px; height: 892px; border-radius: 40px;
  border: 10px solid #17191e;
  box-shadow: 0 40px 90px -40px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.06);
  --safe-t: 42px; --safe-b: 22px;
}
/* Tablet / iPad */
.device[data-device="tablet"] .device__frame {
  width: 834px; height: 900px; border-radius: 34px;
  border: 13px solid #1b1e24;
  box-shadow: 0 40px 90px -40px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.06);
  --safe-t: 34px; --safe-b: 22px;
}

}

function ring(pct, opts = {}) {
  const size = opts.size || 208, sw = opts.stroke || 12;
  const r = (size - sw) / 2, c = 2 * Math.PI * r;
  const off = c * (1 - pct / 100);
  return `<div class="ring" style="width:${size}px;height:${size}px" role="img" aria-label="${Math.round(pct)} percent complete">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
      <circle class="ring__track" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="${sw}"/>
      <circle class="ring__fill" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="${sw}"
        stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
    </svg>
    <div class="ring__label"><span class="ring__pct t-num">${Math.round(pct)}<small>%</small></span></div>
  </div>`;
}

function checkAnimated(size = 96) {
  return `<div class="checkwrap" style="width:${size}px;height:${size}px">

            <button class="row row--tap" data-act="toast-copied" style="min-height:52px"><span class="row__txt"><span class="row__title" style="font-size:14.5px">File name</span><span class="t-xs row__sub">${H.esc(v.title.split(" — ")[0].slice(0, 32))}…</span></span><span class="row__chev" aria-hidden="true">${SV.edit}</span></button>
          </div>
        </div>` : ""}
      </div>

      <div style="padding-top:14px;border-top:1px solid var(--stroke);margin-top:12px">
        <button class="btn btn--primary btn--lg btn--block" data-act="start-download">${SV.download} Download ${sel.label}</button>
        <button class="btn btn--ghost btn--block mt-2" data-act="toggle-more" aria-expanded="${st.moreOptions}">${st.moreOptions ? "Fewer options" : "More options"}</button>
      </div>
    </div>
  </div>`;
}

/* ==========================================================================
   SnapVid — screens part B: progress, complete, library, states,
   desktop website
   ========================================================================== */

/* ------------------------------- PROGRESS -------------------------------- */
Screens.progress = (st) => {
  const v = H.vid(st.videoId);
  const f = v.formats.find((x) => x.id === st.quality) || v.formats[1];
  const total = parseFloat(f.size);
  const done = (total * st.progress) / 100;
  const pct = Math.round(st.progress);
  return `<div class="app">
  ${appbar({ title: "Downloading", right: `<button class="btn btn--icon btn--ghost" data-act="cancel-download" aria-label="Cancel download">${SV.x}</button>` })}
  <div class="scroll" style="padding-bottom:calc(140px + var(--safe-b))">
    <div class="split">
      <div>
        ${thumb(v.id, { leftTop: `<span class="badge badge--solid">${f.label}</span>`, leftBottom: `<span class="badge" data-live="state" style="background:rgba(6,7,10,.72);color:#fff;border-color:rgba(255,255,255,.16)">${st.paused ? "Paused" : "Downloading"}</span>` })}
        <h1 class="t-h3 mt-4" style="font-size:17px;line-height:1.32">${H.esc(v.title)}</h1>
        <p class="t-xs mt-2">${H.esc(v.source)} · ${f.fmt}</p>
      </div>

      <div class="stack" style="align-items:center;gap:16px;padding-top:6px">
        ${ring(pct)}
        <div style="text-align:center">
          <p class="t-sm mono-num" style="color:var(--text);font-weight:600" data-live="size">${done.toFixed(1)} MB <span style="color:var(--text-3)">of ${f.size}</span></p>
          <p class="t-xs mt-2" aria-live="polite" data-live="eta">${st.paused ? "Paused · tap Resume to continue" : `About ${st.etaTxt} remaining · ${st.speed} MB/s`}</p>
        </div>
      </div>
    </div>

    <div class="inset-card mt-5" style="padding:14px">
      <div class="bar"><div class="bar__fill" data-live="bar" style="width:${pct}%"></div></div>
      <div class="between mt-4">
        <span class="t-xs" style="color:${pct > 0 ? "var(--text)" : "var(--text-3)"}">Fetching</span>
        <span class="t-xs" style="color:${pct > 12 ? "var(--text)" : "var(--text-3)"}">Transferring</span>
        <span class="t-xs" style="color:${pct > 92 ? "var(--text)" : "var(--text-3)"}">Saving</span>
      </div>
    </div>

    <div class="mt-5">${policyNote("muted", `Permission verified for ${H.esc(v.source)}. The file stays on this device.`)}</div>
  </div>
  <div style="padding:12px 18px calc(20px + var(--safe-b));background:linear-gradient(180deg,transparent,var(--bg) 42%)">
    <div class="center gap-3">
      <button class="btn btn--primary btn--lg grow" data-act="${st.paused ? "resume" : "pause"}">${st.paused ? SV.play : SV.pause} ${st.paused ? "Resume" : "Pause"}</button>
      <button class="btn btn--lg" data-act="cancel-download">${SV.x} Cancel</button>
    </div>
  </div>
</div>`;
};

/* ------------------------------- COMPLETE -------------------------------- */
Screens.complete = (st) => {
  const v = H.vid(st.videoId);
  const f = v.formats.find((x) => x.id === st.quality) || v.formats[1];
  return `<div class="app">
  ${appbar({ title: "Saved", right: `<button class="btn btn--icon btn--ghost" data-act="tab-home" aria-label="Close">${SV.x}</button>` })}
  <div class="scroll" style="display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:14px;padding-bottom:calc(40px + var(--safe-b))" role="status">
    ${checkAnimated(96)}
    <h1 class="t-h2 mt-5">Download complete</h1>
    <p class="t-body mt-3" style="max-width:32ch">${H.esc(v.title)}</p>

    <div class="inset-card mt-5" style="width:100%;padding:4px 14px;text-align:left">
      <div class="row"><span class="row__txt"><span class="t-xs">Quality</span><span class="row__title" style="font-size:14.5px">${f.label} · ${f.fmt}</span></span><span class="badge badge--ok">${SV.check} Verified</span></div>
      <div class="row"><span class="row__txt"><span class="t-xs">File size</span><span class="row__title" style="font-size:14.5px">${f.size}</span></span></div>
      <div class="row"><span class="row__txt"><span class="t-xs">Saved to</span><span class="row__title" style="font-size:14.5px">Files ▸ SnapVid</span></span><span class="row__chev" aria-hidden="true">${SV.folder}</span></div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:22px">
      <button class="btn btn--primary btn--lg" data-act="toast-opened">${SV.external} Open</button>
      <button class="btn btn--lg" data-act="toast-shared">${SV.share} Share</button>
    </div>
    <button class="btn btn--ghost btn--block mt-2" data-act="tab-home">${SV.plus} Download another</button>

    <div class="mt-5" style="width:100%">${policyNote("muted", "Shared files keep their original licence terms.")}</div>
  </div>
  ${st.toast ? toast(st.toast) : ""}
</div>`;
};

/* -------------------------------- LIBRARY -------------------------------- */
function mrowItem(d, i, openMenu) {
  const v = H.vid(d.vid);
  return `<div class="mrow" style="padding:14px 0;border-bottom:1px solid var(--stroke)">
    <span class="mrow__thumb">
      <img src="${IMG[v.thumb]}" alt="" loading="lazy" />
      <span class="badge badge--solid" style="position:absolute;left:6px;top:6px;height:20px;font-size:10.5px;padding:0 7px">${d.q}</span>
    </span>
    <span class="mrow__body">
      <span class="mrow__title">${H.esc(v.title)}</span>
      <span class="mrow__meta">
        <span class="t-xs">${d.fmt}</span><span class="t-xs" style="color:var(--text-3)">·</span>
        <span class="t-xs">${d.size}</span><span class="t-xs" style="color:var(--text-3)">·</span>
        <span class="t-xs">${d.time}</span>
      </span>
    </span>
    <button class="btn btn--icon btn--ghost" data-act="row-menu" data-i="${i}"
      aria-label="More actions for ${H.esc(v.title)}" aria-haspopup="menu" aria-expanded="${openMenu}">${SV.dots}</button>
  </div>`;
}

function rowMenu(d) {
  return `<div style="position:absolute;inset:0;z-index:45">
    <div class="sheet-scrim" data-act="close-menu"></div>
    <div class="card" role="menu" aria-label="File actions"
      style="position:absolute;right:16px;top:32%;width:228px;padding:8px;background:var(--glass-2);animation:pop 200ms var(--e-out) both">
      <p class="t-xs" style="padding:6px 10px 8px;border-bottom:1px solid var(--stroke);margin-bottom:6px">${H.esc(H.vid(d.vid).title.slice(0, 30))}…</p>
      ${[["Open", SV.external, "toast-opened"], ["Share", SV.share, "toast-shared"], ["Rename", SV.edit, "toast-renamed"], ["Delete", SV.trash, "confirm-delete"]]
        .map(([l, ic, act]) => `<button class="row row--tap" role="menuitem" data-act="${act}" style="min-height:46px;padding:0 10px;border-bottom:0;${l === "Delete" ? "color:var(--sv-danger)" : ""}">
          <span aria-hidden="true" style="display:inline-flex;color:${l === "Delete" ? "var(--sv-danger)" : "var(--text-3)"}">${ic}</span>
          <span class="grow" style="font-size:15px">${l}</span></button>`).join("")}
    </div>
  </div>`;
}

Screens.library = (st) => {
  const list = st.libEmpty ? [] : DOWNLOADS;
  const q = (st.libQuery || "").toLowerCase();
  const filtered = list.filter((d) => {
    const v = H.vid(d.vid);
    const matchQ = !q || v.title.toLowerCase().includes(q) || d.q.toLowerCase().includes(q) || d.fmt.toLowerCase().includes(q);
    const matchF = st.libFilter === "all" || (st.libFilter === "audio" ? d.fmt === "M4A" : d.fmt === "MP4");
    return matchQ && matchF;
  });
  const groups = ["Today", "Yesterday", "Older"];
  return `<div class="app">
  ${appbar({ title: "Downloads", right: `<button class="btn btn--icon btn--ghost" data-act="focus-search" aria-label="Search downloads">${SV.search}</button>` })}
  <div class="scroll">
    <div class="field" style="min-height:52px">
      <span class="field__ico" aria-hidden="true">${SV.search}</span>
      <label class="sv-sr" for="libSearch">Search downloads</label>
      <input id="libSearch" type="text" placeholder="Search downloads" value="${H.esc(st.libQuery || "")}" data-act="lib-search" enterkeyhint="search" />
      ${st.libQuery ? `<button class="btn btn--icon btn--ghost" data-act="clear-search" aria-label="Clear search">${SV.x}</button>` : ""}
    </div>
    <div class="center gap-2 wrap mt-4">
      ${[["all", "All"], ["video", "Video"], ["audio", "Audio"]].map(([k, l]) => `<button class="badge" data-act="lib-filter" data-f="${k}"
        aria-pressed="${st.libFilter === k}" style="height:32px;${st.libFilter === k ? "background:var(--accent-soft);border-color:var(--sv-accent-ring);color:var(--accent-text)" : ""}">${l}</button>`).join("")}
      <button class="badge" data-act="toast-sorted" style="height:32px;margin-left:auto">${SV.order} Newest</button>
    </div>

    ${list.length === 0
      ? `<div class="mt-6">${stateBlock(EMPTIES.library, { primaryAct: "tab-home", secondaryAct: "toast-how" })}</div>`
      : filtered.length === 0
        ? `<div class="mt-6">${stateBlock(EMPTIES.search, { primaryAct: "clear-search" })}</div>`
        : groups.map((g) => {
            const items = filtered.filter((d) => d.group === g);
            if (!items.length) return "";
            return `<div class="sec-head"><span class="sec-head__t">${g}</span><span class="t-xs">${items.length} file${items.length > 1 ? "s" : ""}</span></div>
              <section>${items.map((d) => mrowItem(d, DOWNLOADS.indexOf(d), st.libMenu === DOWNLOADS.indexOf(d))).join("")}</section>`;
          }).join("")}

    ${st.libEmpty ? "" : `<div class="mt-6">${policyNote("muted", "Files are stored locally. Clearing history never deletes the files themselves.")}</div>`}
  </div>
  ${st.libMenu >= 0 ? rowMenu(DOWNLOADS[st.libMenu]) : ""}
  ${tabbar("library")}
  ${st.toast ? toast(st.toast) : ""}
</div>`;
};

/* ------------------------------ ERROR STATES ----------------------------- */
Screens.errors = (st) => {
  const keys = Object.keys(ERRORS);
  const cur = st.errorKey || "invalid";
  const primary = ERRORS[cur];
  const rest = keys.filter((k) => k !== cur).map((k) => ERRORS[k]);
  const col = { warn: ["var(--sv-warn)", "var(--sv-warn-soft)"], danger: ["var(--sv-danger)", "var(--sv-danger-soft)"], info: ["var(--sv-info)", "var(--sv-info-soft)"] }[primary.tone];
  return `<div class="app">
  ${appbar({ title: "Error states", back: true, right: `<span class="badge">${keys.length} patterns</span>` })}
  <div class="scroll">
    <div class="banner banner--info">
      <span class="banner__ico" aria-hidden="true">${SV.info}</span>
      <div>
        <p class="banner__t" style="color:var(--text)">Every failure answers three questions</p>
        <p class="banner__d">What happened · why it happened · what to do next. Recovery is always the first action, and no link dead-ends.</p>
      </div>
    </div>

    <div class="center gap-2 wrap mt-5">
      ${keys.map((k) => `<button class="badge" data-act="set-error" data-e="${k}" style="height:32px;${k === cur ? "background:var(--accent-soft);border-color:var(--sv-accent-ring);color:var(--accent-text)" : ""}">${ERRORS[k].code}</button>`).join("")}
    </div>

    <div class="card card--pad mt-4" style="text-align:center;padding:32px 20px" role="alert">
      <span class="row__ico" style="margin:0 auto;width:54px;height:54px;border-radius:17px;background:${col[1]};border-color:transparent;color:${col[0]}">${SV[primary.icon]}</span>
      <h2 class="t-h3 mt-4">${primary.title}</h2>
      <p class="t-sm mt-3" style="max-width:34ch;margin-inline:auto">${primary.body}</p>
      <div class="center gap-3 wrap" style="justify-content:center;margin-top:22px">
        <button class="btn btn--primary" data-act="retry-analyze">${primary.actions[0]}</button>
        <button class="btn btn--outline" data-act="toast-dismissed">${primary.actions[1] || "Dismiss"}</button>
      </div>
      ${primary.hint ? `<p class="t-xs mt-4">${primary.hint}</p>` : ""}
    </div>

    <div class="sec-head"><span class="sec-head__t">Inline &amp; banner patterns</span></div>
    <div class="stack gap-3">
      <div class="field field--error" style="min-height:56px">
        <span class="field__ico" aria-hidden="true">${SV.chain}</span>
        <input value="htp:/broken link" aria-invalid="true" aria-label="Video URL with an error" readonly />
        <button class="btn btn--sm" data-act="clear-url" style="min-height:40px">Clear</button>
      </div>
      <p class="t-xs" style="color:var(--sv-danger);display:flex;gap:6px;align-items:center">${SV.alert} Check the URL or try another supported source.</p>
      <div class="banner banner--warn" role="alert">
        <span class="banner__ico" aria-hidden="true">${SV.alert}</span>
        <div><p class="banner__t">Waiting for Wi‑Fi</p><p class="banner__d">This 412 MB download is paused and resumes automatically on a Wi‑Fi network.</p></div>
      </div>
      <div class="banner banner--danger" role="alert">
        <span class="banner__ico" aria-hidden="true">${SV.alert}</span>
        <div class="grow"><p class="banner__t">Download interrupted</p><p class="banner__d">Connection lost at 62%. Retry continues from where it stopped.</p></div>
        <button class="btn btn--sm" data-act="resume">Retry</button>
      </div>
      <div class="toast" style="position:static;transform:none;animation:none;justify-content:center;white-space:normal;text-align:center">
        <span style="color:var(--sv-danger);display:inline-flex" aria-hidden="true">${SV.alert}</span> File generation failed · tap to retry
      </div>
    </div>

    <div class="sec-head"><span class="sec-head__t">All other states</span></div>
    <div class="stack gap-3">${rest.map((e) => errorCard(e)).join("")}</div>
    <div class="mt-6">${policyNote("warn", "Errors never suggest bypassing DRM, logins or platform limits.", { act: "open-policy", label: "Policy" })}</div>
  </div>
  ${st.toast ? toast(st.toast) : ""}
</div>`;
};

/* ------------------------------ EMPTY STATES ----------------------------- */
Screens.empty = (st) => {
  const keys = Object.keys(EMPTIES);
  const cur = st.emptyKey || "library";
  const e = EMPTIES[cur];
  const others = keys.filter((k) => k !== cur).map((k) => EMPTIES[k]);
  return `<div class="app">
  ${appbar({ title: "Empty states", back: true, right: `<span class="badge">${keys.length} states</span>` })}
  <div class="scroll">
    <div class="banner banner--info">
      <span class="banner__ico" aria-hidden="true">${SV.info}</span>
      <div><p class="banner__t" style="color:var(--text)">Empty is still useful</p>
      <p class="banner__d">Each empty state names the situation, explains what will appear, and offers exactly one primary action.</p></div>
    </div>

    <div class="center gap-2 wrap mt-5">
      ${keys.map((k) => `<button class="badge" data-act="set-empty" data-e="${k}" style="height:32px;${k === cur ? "background:var(--accent-soft);border-color:var(--sv-accent-ring);color:var(--accent-text)" : ""}">${EMPTIES[k].title}</button>`).join("")}
    </div>

    <div class="card mt-4" style="padding:8px 16px 20px">${stateBlock(e, { primaryAct: "primary-empty", secondaryAct: "toast-how" })}</div>

    <div class="sec-head"><span class="sec-head__t">Other states</span></div>
    <div class="stack gap-3">
      ${others.map((o) => `<div class="card" style="padding:6px 16px 18px">${stateBlock(o, { primaryAct: "primary-empty", secondaryAct: "toast-how" })}</div>`).join("")}
    </div>

    <div class="sec-head"><span class="sec-head__t">Library, in context</span></div>
    <div class="inset-card" style="padding:6px 14px">
      ${stateBlock(EMPTIES.library, { primaryAct: "tab-home" })}
    </div>
    <div class="mt-6">${policyNote("muted", "Nothing is uploaded to SnapVid — an empty library means an empty server too.")}</div>
  </div>
  ${tabbar("library")}
</div>`;
};

/* --------------------------- DESKTOP (WEBSITE) --------------------------- */
function siteNav(st, active) {
  return `<nav class="site__nav">
    <div class="center gap-3">
      <span class="appbar__mark" style="width:36px;height:36px;border-radius:11px" aria-hidden="true">${SV.mark(20, "#fff")}</span>
      <span class="site__word">SnapVid</span>
    </div>
    <div class="site__links">
      ${[["home", "Home"], ["library", "Downloads"]]
        .map(([k, l]) => `<button data-act="site-${k}" ${active === k ? 'aria-current="page"' : ""}>${l}</button>`).join("")}
    </div>
    <div class="center gap-3" style="margin-left:auto">
      ${st.siteLibOpen ? `<div class="field" style="min-height:40px;max-width:260px;border-radius:var(--r-pill);padding-left:14px">
        <span class="field__ico" aria-hidden="true">${SV.search}</span>
        <input placeholder="Search downloads" aria-label="Search downloads" style="height:36px;font-size:14px" />
      </div>` : ""}
      <div class="seg" style="width:210px" role="tablist" aria-label="Appearance">
        <span class="seg__thumb" style="width:calc((100% - 6px)/3);transform:translateX(calc(${["dark", "light", "system"].indexOf(st.themePref)} * 100%))"></span>
        ${[["dark", "Dark"], ["light", "Light"], ["system", "Auto"]]
          .map(([k, l]) => `<button role="tab" data-act="set-theme" data-v="${k}" aria-selected="${st.themePref === k}" style="height:34px;font-size:13.5px">${l}</button>`).join("")}
      </div>
      <button class="btn btn--icon btn--sm" data-act="toast-help" aria-label="Help and profile" style="min-width:40px;height:40px">
        <span aria-hidden="true" style="width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:680;color:#fff;background:linear-gradient(150deg,#3b4250,#1e2229)">AR</span>
      </button>
    </div>
  </nav>`;
}

Screens.desktop = (st) => {
  const v = H.vid(st.videoId);
  const sel = v.formats.find((f) => f.id === st.quality) || v.formats[1];
  const page = st.sitePage || "home";
  let content = "";

  if (page === "home") {
    content = `<div class="site__inner">
      <div style="text-align:center;max-width:760px;margin:12px auto 34px" class="site-hero">
        <span class="badge badge--accent" style="height:30px">${SV.bolt} Snaps in seconds</span>
        <h1 class="mt-4">Download videos. <span class="hero__grad">Your way.</span></h1>
        <p class="t-body" style="margin-inline:auto">Paste a supported video link and choose your preferred quality — 4K down to audio, with file sizes up front.</p>
      </div>

      <div style="max-width:900px;margin:0 auto 26px" class="card card--pad">
        <div class="field">
          <span class="field__ico" aria-hidden="true">${SV.chain}</span>
          <label class="sv-sr" for="siteUrl">Video URL</label>
          <input id="siteUrl" placeholder="Paste video URL" value="${H.esc(st.url)}" data-act="url-input" />
          ${st.url ? `<button class="btn btn--icon btn--ghost" data-act="clear-url" aria-label="Clear link">${SV.x}</button>` : ""}
          <button class="btn btn--sm" data-act="paste" style="min-height:44px">${SV.clipboard} Paste</button>
          <button class="btn btn--primary btn--sm" data-act="analyze" style="min-height:44px;padding:0 22px">${st.busy ? "Analyzing…" : "Analyze Video"}</button>
        </div>
        <div class="between mt-3">
          <p class="t-xs">Works with sources that allow downloading · no DRM, no logins bypassed</p>
          <div class="center gap-2">${[SV.cloud, SV.shield, SV.globe, SV.film].map((ic) => `<span class="source-chip" style="width:28px;height:28px;border-radius:9px" aria-hidden="true">${ic}</span>`).join("")}</div>
        </div>
      </div>

      <div class="site-grid">
        <div class="stack gap-5">
          <div class="card site-card">
            <div class="between mb-4">
              <div><p class="t-label">Analyzed</p><h3 class="t-h3 mt-2">${H.esc(v.title)}</h3></div>
              <span class="badge badge--ok">${SV.check} Allowed</span>
            </div>
            ${thumb(v.id, { play: true, eager: true, scrim: true })}
            <div class="center gap-2 wrap mt-4">
              <span class="badge">${SV.clock} ${v.dur}</span>
              <span class="badge">${H.esc(v.source)}</span>
              <span class="badge">${SV.film} ${v.formats.length} formats</span>
              <span class="badge badge--accent">${sel.label} · ${sel.size}</span>
            </div>
            <p class="t-xs mt-4">${H.esc(v.license)}. SnapVid verified permission before offering these formats.</p>
          </div>

          <div class="card site-card">
            <p class="t-label">Recent downloads</p>
            <div class="site-lib mt-4">
              ${DOWNLOADS.slice(0, 3).map((d) => {
                const dv = H.vid(d.vid);
                return `<div class="inset-card" style="padding:10px;border-radius:var(--r-lg)">
                  <div style="border-radius:12px;overflow:hidden;position:relative;aspect-ratio:16/9">
                    <img src="${IMG[dv.thumb]}" alt="" style="width:100%;height:100%;object-fit:cover;display:block;border-radius:12px" loading="lazy" />
                    <span class="badge badge--solid" style="position:absolute;left:8px;top:8px;height:22px;font-size:11px">${d.q}</span>
                  </div>

  let t = S.themePref;
  if (t === "system") t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  S.theme = t;
  document.documentElement.dataset.theme = t;
  document.documentElement.dataset.motion = S.motion === "calm" ? "calm" : "full";
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", t === "dark" ? "#08090b" : "#f4f5f7");
}

/* --------------------------- LIVE PROGRESS ------------------------------ */
let tickTimer = null;

function startProgress() {
  S.progress = 0; S.paused = false; S.screen = "progress";
  render();
  if (tickTimer) clearInterval(tickTimer);
  tickTimer = setInterval(() => {
    if (S.paused) return;
    const inc = 0.9 + Math.random() * 1.6;
    S.progress = Math.min(100, S.progress + inc);
    const remaining = Math.max(1, Math.round((100 - S.progress) / 2.2));
    S.etaTxt = remaining > 60 ? `${Math.floor(remaining / 60)} min ${remaining % 60} s` : `${remaining} s`;
    S.speed = (4 + Math.random() * 2.4).toFixed(1);
    paintProgress();
    if (S.progress >= 100) {
      clearInterval(tickTimer); tickTimer = null;
      setTimeout(() => { S.screen = "complete"; render(); }, 420);
    }
  }, 120);
}

function paintProgress() {
  const root = $("#screen");
  if (!root || S.screen !== "progress") return;
  const fill = root.querySelector(".ring__fill");
  const pctEl = root.querySelector(".ring__pct");
  if (fill) {
    const c = parseFloat(fill.getAttribute("stroke-dasharray"));
    fill.setAttribute("stroke-dashoffset", String(c * (1 - S.progress / 100)));
  }
  if (pctEl) pctEl.innerHTML = `${Math.round(S.progress)}<small>%</small>`;
  const f = H.vid(S.videoId).formats.find((x) => x.id === S.quality) || H.vid(S.videoId).formats[1];
  const total = parseFloat(f.size);
  $$('[data-live="size"]', root).forEach((el) => { el.innerHTML = `${((total * S.progress) / 100).toFixed(1)} MB <span style="color:var(--text-3)">of ${f.size}</span>`; });
  $$('[data-live="eta"]', root).forEach((el) => { el.textContent = S.paused ? "Paused · tap Resume to continue" : `About ${S.etaTxt} remaining · ${S.speed} MB/s`; });
  $$('[data-live="bar"]', root).forEach((el) => { el.style.width = `${S.progress}%`; });
  $$('[data-live="state"]', root).forEach((el) => { el.textContent = S.paused ? "Paused" : "Downloading"; });
}

/* ------------------------------ ANALYSIS -------------------------------- */
function analyze() {
  const url = S.url.trim();
  if (!url) { S.fieldError = true; render(); return; }
  const low = url.toLowerCase();
  if (low.includes("blocked") || low.includes("drm") || low.includes("netflix")) {
    S.errorKey = "unsupported"; S.screen = "errors"; S.fieldError = false; render(); return;
  }
  if (low.includes("private") || low.includes("deleted")) {
    S.errorKey = "unavailable"; S.screen = "errors"; S.fieldError = false; render(); return;
  }
  if (!/^https?:\/\//.test(low) && !/^[a-z0-9-]+\.[a-z]{2,}\//.test(low)) { S.fieldError = true; render(); return; }

  S.fieldError = false; S.busy = true; S.analyzeStep = 0; S.analyzeStage = "Reading link…";
  S.screen = "analyze"; S.history.push("home"); render();
  const stages = ["Reading link…", "Checking source permission…", "Fetching available formats…"];
  [0, 620, 1240].forEach((d, i) => setTimeout(() => {
    S.analyzeStep = i; S.analyzeStage = stages[i];
    if (i > 0) render();
  }, d));
  setTimeout(() => { S.busy = false; S.screen = "preview"; S.history.push("analyze"); render(); }, 1750);
}

function showToast(text, tone) {
  S.toast = { text, tone };
  const app = $("#screen .app");

  const old = app.querySelector(".toast"); if (old) old.remove();
  app.insertAdjacentHTML("beforeend", toast({ text, tone }));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    const t = $("#screen .toast"); if (t) t.remove();
    S.toast = null;
  }, 2200);
}

/* ---------------------------- GUIDED DEMO ------------------------------- */
let demoTimers = [];
function clearDemo() { demoTimers.forEach(clearTimeout); demoTimers = []; }

function playDemo() {
  clearDemo();
  if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
  Object.assign(S, {
    demo: true, device: S.device === "desktop" ? "desktop" : "iphone", url: "", fieldError: false,
    onbStep: 0, moreOptions: false, libEmpty: false, libQuery: "", libFilter: "all", libMenu: -1,
    videoId: "iceland", quality: "720", progress: 0, paused: false, sitePage: "home",
  });
  const steps = [
    [0, () => { S.screen = "splash"; render(); }],
    [1300, () => { S.screen = "onboarding"; S.onbStep = 0; render(); }],
    [3100, () => { S.onbStep = 1; render(); }],
    [4900, () => { S.onbStep = 2; render(); }],
    [6700, () => { S.screen = "home"; render(); }],
  ];
  const sample = DEMO_URLS.iceland;
  for (let i = 0; i < sample.length; i++) {
    steps.push([7000 + i * 42, () => {
      S.url = sample.slice(0, i + 1);
      const input = $("#urlInput"); if (input) { input.value = S.url; }
      const app = $("#screen .app"); if (app && !app.querySelector('[data-act="clear-url"]')) {
        renderStage();
      }
    }]);
  }
  steps.push([7000 + sample.length * 42 + 320, () => { renderStage(); }]);
  steps.push([7000 + sample.length * 42 + 700, () => { S.busy = true; S.analyzeStep = 0; analyze(); }]);
  steps.push([11200, () => { S.screen = "quality"; S.moreOptions = false; render(); }]);
  steps.push([13400, () => { S.moreOptions = true; render(); }]);
  steps.push([15200, () => { S.moreOptions = false; S.screen = "progress"; startProgress(); }]);
  steps.push([17000, () => { S.paused = true; paintProgress(); render(); S.screen = "progress"; S.paused = true; paintProgress(); }]);
  steps.push([18600, () => { S.paused = false; paintProgress(); showToast("Download resumed", "ok"); }]);
  steps.forEach(([t, fn]) => demoTimers.push(setTimeout(fn, t)));
}

/* ------------------------------ INTERACTION ----------------------------- */
document.addEventListener("click", (ev) => {
  const goto = ev.target.closest("[data-goto]");
  if (goto) { go(goto.dataset.goto); return; }
  const dev = ev.target.closest("[data-device]");
  if (dev && dev.tagName === "BUTTON") {   // device switchers only — never the frame wrapper
    S.device = dev.dataset.device;
    if (S.device === "desktop") S.screen = "desktop";
    else if (S.screen === "desktop") S.screen = "home";
    render(); return;
  }
  const t = ev.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act;

  const T = (text, tone) => showToast(text, tone);
  switch (act) {
    case "tab-home": go("home"); break;
    case "tab-library": go("library"); break;
    case "site-home": S.sitePage = "home"; render(); break;
    case "site-library": S.sitePage = "library"; render(); break;
    case "back": {
      const prev = S.history.pop();
      if (prev) go(prev, false); else go(S.screen === "home" ? "home" : "home", false);
      break;
    }
    case "paste": S.url = DEMO_URLS[S.videoId] || DEMO_URLS.iceland; S.fieldError = false; render(); T("Link pasted from clipboard"); break;
    case "clear-url": S.url = ""; S.fieldError = false; render(); break;
    case "analyze": analyze(); break;
    case "cancel-analyze": S.busy = false; go("home"); break;
    case "open-quality": S.screen = "quality"; go("quality"); break;
    case "close-sheet": go("preview"); break;
    case "select-q": S.quality = t.dataset.q; render(); break;
    case "toggle-more": S.moreOptions = !S.moreOptions; render(); break;
    case "start-download": startProgress(); break;
    case "pause": S.paused = true; render(); paintProgress(); T("Paused", "warn"); break;
    case "resume": S.paused = false; render(); paintProgress(); T("Resumed", "ok"); break;
    case "cancel-download": if (tickTimer) { clearInterval(tickTimer); tickTimer = null; } S.progress = 0; go("preview"); T("Download cancelled", "warn"); break;
    case "open-file": T("Opening in player…"); break;
    case "row-menu": S.libMenu = Number(t.dataset.i); render(); break;
    case "close-menu": S.libMenu = -1; render(); break;
    case "confirm-delete": S.libMenu = -1; render(); T("Deleted · Undo available", "warn"); break;
    case "lib-filter": S.libFilter = t.dataset.f; render(); break;
    case "clear-search": S.libQuery = ""; render(); break;
    case "focus-search": { const i = $("#libSearch"); if (i) i.focus(); break; }
    case "set-theme": S.themePref = t.dataset.v; render(); T(`Theme: ${t.dataset.v === "system" ? "System" : t.dataset.v}`, "ok"); break;
    case "toggle": { const on = t.getAttribute("aria-checked") === "true"; t.setAttribute("aria-checked", String(!on)); break; }
    case "set-error": S.errorKey = t.dataset.e; render(); break;
    case "set-empty": S.emptyKey = t.dataset.e; render(); break;
    case "primary-empty": T("Nothing to do yet — this is a design preview"); break;
    case "retry-analyze": S.errorKey = S.errorKey; go("home"); T("Try again", "ok"); break;
    case "toggle-lib-empty": S.libEmpty = !S.libEmpty; render(); break;
    case "play-demo": S.demo ? (S.demo = false, clearDemo(), render()) : playDemo(); break;
    case "reset-all": clearDemo(); if (tickTimer) clearInterval(tickTimer); location.reload(); break;
    case "onb-next": S.onbStep = Math.min(2, S.onbStep + 1); render(); break;
    case "onb-dot": S.onbStep = Number(t.dataset.i); render(); break;
    case "onb-skip": case "onb-done": go("home"); break;
    case "open-policy": case "open-privacy": S.policyOpen = true; $("#screen").insertAdjacentHTML("beforeend", policySheet()); break;
    case "close-policy": { const s = $("#screen .sheet-wrap"); if (s) s.remove(); S.policyOpen = false; break; }
    case "noop": break;
    default:
      if (act.startsWith("toast-")) {
        const map = {
          "toast-copied": "Link copied", "toast-opened": "Opening file…", "toast-shared": "Share sheet opened",
          "toast-renamed": "Rename opened", "toast-location": "Choose a folder",
          "toast-sorted": `Sorted by: ${S.sortDir}`, "toast-help": "Help centre opened", "toast-how": "Guided tour started",
          "toast-generic": "Got it", "toast-dismissed": "Dismissed", "toast-clear": "History cleared",
        };
        T(map[act] || "Done", act.includes("renamed") ? "warn" : "ok");
      }
  }
});

/* URL field: live input handling without full re-render (keeps the caret) */
document.addEventListener("input", (ev) => {
  const el = ev.target;
  if (el.dataset.act === "url-input") {
    S.url = el.value; S.fieldError = false;
    const app = $("#screen .app");
    const field = el.closest(".field");
    if (field) {
      const has = !!field.querySelector('[data-act="clear-url"]');
      if (el.value && !has) {
        const btn = document.createElement("button");
        btn.className = "btn btn--icon btn--ghost"; btn.dataset.act = "clear-url"; btn.setAttribute("aria-label", "Clear link");
        btn.innerHTML = SV.x; field.insertBefore(btn, field.querySelector('[data-act="paste"]'));
      } else if (!el.value && has) {
        field.querySelector('[data-act="clear-url"]').remove();
      }
      field.classList.toggle("field--error", false);
    }
  }
  if (el.dataset.act === "lib-search") {
    S.libQuery = el.value;
    const cur = el.selectionStart;
    render();
    const again = $("#libSearch"); if (again) { again.focus(); again.setSelectionRange(cur, cur); }
  }
});

document.addEventListener("keydown", (ev) => {
  const inField = ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName);
  if (ev.key === "Enter" && document.activeElement.dataset && document.activeElement.dataset.act === "url-input") { analyze(); return; }
  if (inField) return;
  const i = MOBILE_ONLY.indexOf(S.screen === "quality" ? "quality" : S.screen);
  if (ev.key === "ArrowRight") { go(nextScreen(1)); }
  else if (ev.key === "ArrowLeft") { go(nextScreen(-1)); }
  else if (ev.key.toLowerCase() === "t") { S.themePref = S.themePref === "dark" ? "light" : "dark"; render(); }
  else if (ev.key.toLowerCase() === "d") {
    const order = DEVICE_LIST.map((d) => d.id);
    S.device = order[(order.indexOf(S.device) + 1) % order.length];
    if (S.device === "desktop") S.orient = "landscape";
    if (S.device === "desktop") S.screen = "desktop";
    else if (S.screen === "desktop") S.screen = "home";
    render();
  }
  else if (ev.key.toLowerCase() === "p") { S.demo = false; playDemo(); }
  else if (ev.key.toLowerCase() === "r" && S.device !== "desktop") { S.orient = S.orient === "portrait" ? "landscape" : "portrait"; render(); }
  else if (/^[1-9]$/.test(ev.key)) { const s = SCREENS[Number(ev.key) - 1]; if (s) go(s.id); }
  else if (ev.key === "Escape") { const p = $("#screen .sheet-wrap"); if (p) p.remove(); S.policyOpen = false; }
});

function nextScreen(dir) {
  const list = S.device === "desktop" ? ["desktop"] : MOBILE_ONLY;
  const i = list.indexOf(S.screen);
  return list[(i + dir + list.length) % list.length];
}

function go(id, push = true) {
  if (id === S.screen) { render(); return; }
  if (push && S.screen && S.screen !== "quality") S.history.push(S.screen);
  S.screen = id;
  if (id === "desktop" && S.device !== "desktop") S.device = "desktop";
  if (id !== "desktop" && S.device === "desktop") S.device = "iphone";
  if (id !== "quality") S.moreOptions = S.moreOptions;
  render();
  const sc = $("#screen .scroll"); if (sc) sc.scrollTop = 0;
}

/* ------------------------------ TOP BAR UI ------------------------------ */
function paintTopbar() {
  $("#brandMark").innerHTML = SV.mark(22, "#fff");
  $("#deviceGroup").innerHTML = DEVICE_LIST.map((d) => `<button data-device="${d.id}" aria-pressed="${S.device === d.id}">${SV[d.icon]} ${d.label}</button>`).join("");
  $("#themeGroup").innerHTML = [["dark", "Dark"], ["light", "Light"], ["system", "System"]]
    .map(([k, l]) => `<button data-theme-set="${k}" aria-pressed="${S.themePref === k}">${l}</button>`).join("");
  $("#scenario").innerHTML = [["success", "Flow: success"], ["invalid", "Error: invalid URL"], ["unsupported", "Error: unsupported source"], ["unavailable", "Error: unavailable"], ["permission", "Error: no permission"], ["network", "Error: network"], ["busy", "Error: server busy"], ["filegen", "Error: file generation"], ["empty", "Empty library"], ["offline", "Empty: offline"]]
    .map(([k, l]) => `<option value="${k}">${l}</option>`).join("");
  $("#deviceGroup").addEventListener("click", (e) => {
    const b = e.target.closest("[data-device]"); if (!b) return;
    S.device = b.dataset.device;
    if (S.device === "desktop") S.screen = "desktop";
    else if (S.screen === "desktop") S.screen = "home";
    render();
  });
  $("#themeGroup").addEventListener("click", (e) => {
    const b = e.target.closest("[data-theme-set]"); if (!b) return;
    S.themePref = b.dataset.themeSet; render();
  });
  $("#motionBtn").addEventListener("click", () => { S.motion = S.motion === "calm" ? "full" : "calm"; render(); });
  $("#orientBtn").addEventListener("click", () => { S.orient = S.orient === "portrait" ? "landscape" : "portrait"; render(); });
  $("#scenario").addEventListener("change", (e) => applyScenario(e.target.value));
}

function applyScenario(v) {
  S.scenario = v;
  clearDemo(); if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
  if (v === "success") { S.libEmpty = false; S.url = ""; go("home"); return; }
  if (v === "empty") { S.libEmpty = true; go("library"); return; }
  if (v === "offline") { S.emptyKey = "offline"; go("empty"); return; }
  const map = { invalid: "invalid", unsupported: "unsupported", unavailable: "unavailable", permission: "permission", network: "network", busy: "busy", filegen: "filegen" };
  S.errorKey = map[v] || "invalid";
  go("errors");
}

/* -------------------------------- BOOT ---------------------------------- */
paintTopbar();
render();
if (window.matchMedia) window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => { if (S.themePref === "system") render(); });

/* --------------------- PUBLIC HOOKS (debug & extension) ------------------ */
window.SnapVid = { S, SCREENS, Screens, SV, VIDEOS, ERRORS, EMPTIES, DOWNLOADS, NOTES, POLICY, SOURCES, go, render, playDemo, clearDemo, startProgress, qualitySheet, policySheet };

  // The "Play demo" button in the top bar mirrors the rail action.
  document.getElementById("demoBtn").addEventListener("click", () => {
    S.demo ? (S.demo = false, clearDemo(), render()) : playDemo();
  });
</script>
